[project]
name = "hr-recruit-agent-backend"
version = "0.1.0"
description = "Backend for HR Recruit Agent"
requires-python = ">=3.11"
dependencies = [
    "anthropic==1.13.0",
    "claude-agent-sdk==0.2.165",
    "fastapi==0.143.0",
    "pdfplumber==0.11.10",
    "pydantic==2.14.1",
    "python-docx==1.2.0",
    "python-dotenv==1.2.4",
    "sse-starlette==3.5.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
